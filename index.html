<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gewohnheits-Garten</title>
<meta name="description" content="Deine Gewohnheiten als kleiner Garten: jeden Tag gießen und zusehen, wie alles wächst.">
<meta name="theme-color" content="#211a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garten">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="szene">
  <canvas id="garten" aria-label="Dein Garten. Tippe auf eine Pflanze, um sie zu gießen."></canvas>
  <div id="schilder"></div>
  <header id="kopf">
    <h1 id="titel" aria-label="Gewohnheits-Garten"></h1>
    <p id="gruss"></p>
    <button id="stufe" type="button" hidden></button>
  </header>
  <section id="leer" hidden>
    <p class="leer-titel">Dein Garten wartet.</p>
    <p>Jede Gewohnheit wird eine Pflanze. Gieß sie in ihrem Rhythmus, dann wächst sie – und der Garten mit ihr.</p>
    <button class="knopf haupt" id="leer-neu" type="button">Erste Pflanze setzen</button>
  </section>
</main>
<button id="neu" class="fab" type="button" aria-label="Neue Pflanze setzen"></button>
<button id="nachbarn" class="fab-nb" type="button" aria-label="Nachbarschaft" hidden></button>
<div id="toast" role="status" aria-live="polite"></div>
<div id="schleier" hidden></div>
<div id="blatt" role="dialog" aria-modal="true" hidden></div>
<div id="debug" hidden></div>
<div id="version">1.4</div>
<div id="vignette" aria-hidden="true"></div>
<div id="korn" aria-hidden="true"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
